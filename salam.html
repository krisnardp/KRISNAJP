<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salam – Ungkapan Bahasa Jepang</title>
<meta name="description" content="Latihan 26 salam dan ungkapan bahasa Jepang: pilihan ganda, ketik arti, dan tulis bahasa Jepang.">
<link rel="stylesheet" href="ios.css">
<style>:root{--accent:#af52de;--accent-ink:#fff}@media (prefers-color-scheme:dark){:root{--accent:#bf5af2;--accent-ink:#fff}}</style>
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
</head>
<body>
<main>
  <a class="back" href="index.html">‹ Beranda</a>
  <h1>Salam dan Ungkapan</h1>
  <p class="sub">Latih 26 salam dan ungkapan bahasa Jepang melalui kuis.</p>

  <section id="menu">
    <div class="card">
      <h2>Mode soal</h2>
      <div class="chips" id="modes"></div>
      <p class="hint" id="modeHint"></p>
    </div>
    <div class="card">
      <h2>Materi</h2>
      <div class="chips" id="cats"></div>
      <p class="hint" id="catHint"></p>
    </div>
    <div class="card">
      <h2>Jumlah soal</h2>
      <div class="chips" id="counts"></div>
    </div>
    <div class="card">
      <h2>Batas waktu per soal</h2>
      <div class="chips" id="times"></div>
    </div>
    <div class="card"><button class="btn" id="start">Mulai kuis</button></div>
  </section>

  <section id="quiz" class="hide">
    <div class="hud"><span id="prog"></span><span id="tm"></span><span id="sc"></span></div>
    <div class="bar" aria-hidden="true"><i id="bar"></i></div>
    <div class="card">
      <div class="q" id="q"></div>
      <div class="opts" id="opts"></div>
      <div id="typed" class="hide">
        <input class="inp" id="ans" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Jawabanmu">
        <p class="kbw" id="kbw" role="status"></p>
        <div class="row"><button class="btn" id="check">Periksa</button><button class="btn ghost" id="skip">Tidak tahu</button></div>
      </div>
      <p class="fb" id="fb" aria-live="polite"></p>
      <p class="rd" id="rd"></p>
      <button class="btn hide" id="next">Lanjut</button>
    </div>
    <p class="hint" style="text-align:center">Pilihan ganda: tekan A / B / C. Soal ketik: tekan Enter untuk memeriksa.</p>
  </section>

  <section id="result" class="hide">
    <div class="card">
      <p class="score" id="rs"></p>
      <div class="stats" id="rstats"></div>
      <button class="btn" id="retryWrong">Ulangi soal yang salah</button>
      <button class="btn ghost" id="again">Main lagi dengan pengaturan sama</button>
      <button class="btn ghost" id="toMenu">Kembali ke menu</button>
    </div>
    <div class="card" id="rvCard"><h2>Review jawaban salah</h2><ul class="rv" id="rv"></ul></div>
  </section>
</main>

<script>
// kategori|hiragana|ejaan|arti
const RAW=`S|いいえ、どういたしまして|iie, dou itashimashite|Sama-sama (jawaban dari arigatou)
S|また らいしゅう|mata raishuu|Sampai jumpa minggu depan
S|また あいましょう|mata aimashou|Sampai jumpa lagi
S|おさきに しつれいします|osaki ni shitsurei shimasu|Saya permisi duluan
S|きを つけて ください|ki o tsukete kudasai|Hati-hati di jalan
S|おげんきですか|ogenki desu ka|Apa kabar?
S|おひさしぶりですね|ohisashiburi desu ne|Lama tidak berjumpa ya
S|いろいろ おせわになりました|iroiro osewa ni narimashita|Terima kasih atas bantuan dan kebaikannya selama ini
S|どうぞ おげんきで|douzo ogenki de|Jaga diri baik-baik
S|もうしわけ ございません|moushiwake gozaimasen|Mohon maaf
S|おねがいします|onegaishimasu|Tolong ya / mohon bantuannya
S|おかげさまで|okagesama de|Berkat Anda
S|おだいじに|odaiji ni|Semoga lekas sembuh
S|がんばって ください|ganbatte kudasai|Semangat!
S|おめでとう ございます|omedetou gozaimasu|Selamat!
S|けっこん おめでとう ございます|kekkon omedetou gozaimasu|Selamat atas pernikahannya
S|おたんじょうび おめでとう ございます|otanjoubi omedetou gozaimasu|Selamat ulang tahun
S|あけまして おめでとう ございます|akemashite omedetou gozaimasu|Selamat tahun baru
S|ごめんください|gomen kudasai|Permisi ketika akan masuk rumah orang lain
S|おじゃまします|ojama shimasu|Permisi ketika masuk rumah orang lain
S|どうぞ おあがりください|douzo oagari kudasai|Silakan masuk (rumah)
S|めしあがってください|meshiagatte kudasai|Silakan dinikmati (menawarkan makanan)
S|いただきます|itadakimasu|Ucapan sebelum makan
S|ごちそうさまでした|gochisousama deshita|Terima kasih untuk hidangannya setelah makan
S|いらっしゃいませ|irasshaimase|Selamat datang (diucapkan pegawai toko)
S|かしこまりました|kashikomarimashita|Saya mengerti (diucapkan pegawai toko atau rumah makan)`;

const CATS={S:'Salam dan ungkapan'};
const ALL=RAW.split('\n').map(l=>{const [c,jp,rm,id]=l.split('|');return{c,jp,rm,id}});
const $=s=>document.querySelector(s);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

const cfg={cats:new Set(['S']),count:0,time:15,mode:'mc'};
const MH={mc:'Lihat ungkapan Jepang, lalu pilih arti yang benar (A/B/C).',id:'Lihat ungkapan Jepang, lalu ketik artinya dalam bahasa Indonesia. Waktu soal 2×.',jp:'Lihat arti bahasa Indonesia, lalu tulis ungkapan Jepang dengan hiragana. Waktu soal 2×.',mix:'Campuran pilihan ganda, ketik arti, dan tulis ungkapan Jepang.'};
// ==== helpers ====
const nId=s=>s.toLowerCase().replace(/\(.*?\)/g,' ').replace(/[^a-z0-9]+/g,' ').trim();
const lev=(a,b)=>{const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]};
const okId=(raw,w)=>{const g=nId(raw);if(!g)return false;const c=[nId(w.id),...w.id.split('/').map(nId)].filter(Boolean);return c.some(x=>x===g||(x.length>=5&&lev(x,g)<=1))};
const okJp=(raw,w)=>{const norm=s=>s.replace(/[\s\/／、。！？（）()]/g,'');const g=norm(raw);if(!g)return false;return g===norm(w.jp)};
// ==== end helpers ====
let deck=[],i=0,score=0,wrong=[],locked=false,timer=null,left=0,t0=0,qStart=0,lastDeck=[];

function chips(el,items,isSel,onClick){
  el.innerHTML='';
  items.forEach(([k,label])=>{
    const b=document.createElement('button');b.className='chip';b.textContent=label;
    b.setAttribute('aria-pressed',isSel(k));
    b.onclick=()=>{onClick(k);renderMenu()};el.appendChild(b);
  });
}
function pool(){return ALL.filter(w=>cfg.cats.has(w.c))}
function renderMenu(){
  chips($('#modes'),[['mc','Pilihan ganda'],['id','Ketik arti'],['jp','Tulis bahasa Jepang'],['mix','Campuran']],k=>cfg.mode===k,k=>cfg.mode=k);
  $('#modeHint').textContent=MH[cfg.mode];
  chips($('#cats'),Object.entries(CATS),k=>cfg.cats.has(k),k=>{
    cfg.cats.has(k)?cfg.cats.delete(k):cfg.cats.add(k);
  });
  chips($('#counts'),[[10,'10'],[20,'20'],[0,'Semua (26)']],k=>cfg.count===k,k=>cfg.count=k);
  chips($('#times'),[[10,'10 dtk'],[15,'15 dtk'],[30,'30 dtk'],[0,'Tanpa batas']],k=>cfg.time===k,k=>cfg.time=k);
  const n=pool().length;
  $('#catHint').textContent=n?`${n} kata tersedia.`:'Pilih materi salam.';
  $('#start').disabled=!n;
}
function show(id){['menu','quiz','result'].forEach(s=>$('#'+s).classList.toggle('hide',s!==id))}

function buildDeck(){
  const p=shuffle(pool());
  return cfg.count?p.slice(0,cfg.count):p;
}
function begin(d){
  deck=d;types=planTypes(d.length);lastDeck=d;i=0;score=0;wrong=[];t0=Date.now();
  show('quiz');ask();
}
let curType='mc',types=[];
const planTypes=n=>{if(cfg.mode!=='mix')return Array(n).fill(cfg.mode);const nj=Math.round(n/3);return shuffle(Array.from({length:n-nj},(_,k)=>k%2?'id':'mc')).concat(Array(nj).fill('jp'))};
function ask(){
  locked=false;const w=deck[i];
  curType=types[i];
  $('#prog').textContent=`Soal ${i+1}/${deck.length}`;
  $('#sc').textContent=`Skor ${score}`;
  const q=$('#q');q.classList.toggle('sm',curType==='jp');
  const lab={mc:'Apa arti kata ini?',id:'Ketik artinya dalam bahasa Indonesia',jp:'Tulis ungkapan Jepang (pakai keyboard bahasa Jepang)'}[curType];
  q.innerHTML=`<small>${lab}</small><span></span>`;q.lastChild.textContent=curType==='jp'?w.id:w.jp;
  $('#fb').textContent='';$('#fb').style.color='';$('#rd').textContent='';
  $('#next').classList.add('hide');
  const box=$('#opts'),inp=$('#ans');
  box.innerHTML='';box.classList.toggle('hide',curType!=='mc');$('#typed').classList.toggle('hide',curType==='mc');
  if(curType==='mc'){
    const others=shuffle(ALL.filter(x=>x.id!==w.id)).slice(0,2);
    shuffle([w,...others]).forEach((o,k)=>{
      const b=document.createElement('button');b.className='opt';
      b.innerHTML=`<b>${'ABC'[k]}</b><span></span>`;b.lastChild.textContent=o.id;
      b.onclick=()=>answer(b,o.id===w.id);b.dataset.ok=o.id===w.id;box.appendChild(b);
    });
  }else{
    inp.value='';inp.disabled=false;inp.className='inp';inp.lang=curType==='jp'?'ja':'id';kbNote(false);
    $('#check').disabled=false;$('#skip').disabled=false;inp.focus();
  }
  startTimer();
}
function startTimer(){
  clearInterval(timer);qStart=Date.now();
  const bar=$('#bar'),T=cfg.time?cfg.time*(curType==='mc'?1:2):0;
  bar.style.transition='none';bar.style.transform='scaleX(1)';
  if(!T){$('#tm').textContent='';return}
  left=T;$('#tm').textContent=`${left} dtk`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{bar.style.transition=`transform ${T}s linear`;bar.style.transform='scaleX(0)'}));
  timer=setInterval(()=>{left--;$('#tm').textContent=`${Math.max(left,0)} dtk`;if(left<=0){clearInterval(timer);answer(null,false,true)}},1000);
}
const kbBad=v=>curType==='jp'?/[A-Za-z]/.test(v):/[^\x00-\x7f]/.test(v);
function kbNote(warn){
  const el=$('#kbw');el.classList.toggle('warn',!!warn);
  el.textContent=curType==='jp'
    ?(warn?'Terdeteksi huruf latin. Ganti keyboard ke bahasa Jepang, lalu ketik ulang.':'Pakai keyboard bahasa Jepang dan ketik dalam hiragana.')
    :(warn?'Terdeteksi huruf Jepang. Ganti keyboard ke huruf latin, lalu ketik ulang.':'Pakai keyboard huruf latin (bukan keyboard Jepang).');
}
function check(skip){
  if(locked)return;const w=deck[i],inp=$('#ans');
  const raw=inp.value.trim();
  if(!skip&&kbBad(raw)){kbNote(true);inp.focus();return}
  answer(null,!skip&&(curType==='jp'?okJp(raw,w):okId(raw,w)),false,skip?'':raw);
}
function answer(btn,ok,timeout,given){
  if(locked)return;locked=true;clearInterval(timer);
  const bar=$('#bar');bar.style.transform=getComputedStyle(bar).transform;bar.style.transition='none';
  const w=deck[i],typed=curType!=='mc';
  const g=given!==undefined?given:(btn?btn.lastChild.textContent:(typed?$('#ans').value:''));
  document.querySelectorAll('.opt').forEach(o=>{o.disabled=true;if(o.dataset.ok==='true')o.classList.add('ok')});
  if(typed){const inp=$('#ans');inp.disabled=true;inp.classList.add(ok?'ok':'bad');$('#check').disabled=true;$('#skip').disabled=true}
  const fb=$('#fb');
  if(ok){score++;fb.textContent='Benar!';fb.style.color='var(--ok)'}
  else{
    if(btn)btn.classList.add('bad');
    wrong.push({w,timeout:!!timeout,given:g,type:curType});
    fb.textContent=(timeout?'Waktu habis.':'Kurang tepat.')+(typed?` Jawaban: ${curType==='jp'?w.jp:w.id}`:'');fb.style.color='var(--bad)';
  }
  const rd=$('#rd');rd.innerHTML='<b></b><span></span>';rd.firstChild.textContent=w.jp;rd.lastChild.textContent=`Romaji: ${w.rm} · Arti: ${w.id}`;
  $('#sc').textContent=`Skor ${score}`;
  const n=$('#next');n.textContent=i+1<deck.length?'Lanjut':'Lihat hasil';n.classList.remove('hide');n.focus();
}
function next(){ if(i+1<deck.length){i++;ask()}else finish() }
function finish(){
  clearInterval(timer);
  const pct=Math.round(score/deck.length*100),sec=Math.round((Date.now()-t0)/1000);
  $('#rs').textContent=`${score}/${deck.length}`;
  $('#rstats').innerHTML=`<span>Akurasi ${pct}%</span><span>Waktu ${Math.floor(sec/60)}m ${sec%60}d</span><span>Rata-rata ${(sec/deck.length).toFixed(1)} dtk/soal</span>`;
  const rv=$('#rv');rv.innerHTML='';
  wrong.forEach(({w,timeout,given})=>{
    const li=document.createElement('li');
    li.innerHTML='<span class="jp"></span><span class="yes"></span><span class="no"></span>';
    li.querySelector('.jp').textContent=w.jp;li.querySelector('.yes').dataset.rm=w.rm;li.querySelector('.yes').textContent=`${w.rm} · ${w.id}`;
    li.querySelector('.no').textContent=timeout?'Waktu habis':(given?`Jawabanmu: ${given}`:'Dilewati');
    rv.appendChild(li);
  });
  $('#rvCard').classList.toggle('hide',!wrong.length);
  $('#retryWrong').classList.toggle('hide',!wrong.length);
  show('result');
}
$('#start').onclick=()=>begin(buildDeck());
$('#next').onclick=next;
$('#retryWrong').onclick=()=>begin(shuffle(wrong.map(x=>x.w)));
$('#again').onclick=()=>begin(buildDeck());
$('#toMenu').onclick=()=>{show('menu')};
document.addEventListener('keydown',e=>{
  if($('#quiz').classList.contains('hide')||e.target.id==='ans')return;
  const k='abc'.indexOf(e.key.toLowerCase());
  if(curType==='mc'&&k>-1&&!locked){document.querySelectorAll('.opt')[k]?.click()}
  else if(e.key==='Enter'&&locked){e.preventDefault();next()}
});
$('#ans').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229){e.preventDefault();check()}});
$('#ans').addEventListener('input',e=>{if(!e.isComposing)kbNote(kbBad(e.target.value))});
$('#ans').addEventListener('compositionend',e=>kbNote(kbBad(e.target.value)));
$('#check').onclick=()=>check();
$('#skip').onclick=()=>check(true);
renderMenu();
</script>
</body>
</html>
